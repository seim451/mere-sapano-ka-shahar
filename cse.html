<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE - Panno-Ka-Shahar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f0; }
        .header { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('image.jpg') center/cover no-repeat; color: white; padding: 25px 20px; text-align: center; }
        .header h1 { font-size: 36px; letter-spacing: 4px; }
        .header h1 span { color: #7ddfb0; }
        .header .tagline { font-size: 14px; color: #7ddfb0; }
        .nav { background: #1a3a2a; padding: 12px; text-align: center; }
        .nav a { color: white; text-decoration: none; padding: 8px 18px; margin: 0 4px; border-radius: 20px; transition: 0.3s; font-size: 14px; }
        .nav a:hover { background: #7ddfb0; color: #1a3a2a; }
        .container { max-width: 1200px; margin: 30px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .container h2 { text-align: center; color: #1a3a2a; margin-bottom: 30px; font-size: 28px; }
        .container h2::after { content: ''; display: block; width: 60px; height: 3px; background: #7ddfb0; margin: 8px auto; border-radius: 2px; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .book-card { border: 2px solid #e8f5ee; border-radius: 15px; padding: 18px; text-align: center; transition: all 0.3s; }
        .book-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-color: #7ddfb0; }
        .book-card .book-cover { width: 140px; height: 190px; background: linear-gradient(135deg, #1a3a2a, #7ddfb0); border-radius: 10px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: bold; }
        .book-card h3 { color: #1a3a2a; font-size: 17px; margin: 8px 0 4px; }
        .book-card .author { color: #777; font-size: 13px; }
        .book-card .price { color: #1a3a2a; font-size: 22px; font-weight: bold; margin: 10px 0; }
        .book-card .btn { background: #1a3a2a; color: white; padding: 10px 28px; border: none; border-radius: 25px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .book-card .btn:hover { background: #7ddfb0; color: #1a3a2a; }
        .back-link { text-align: center; margin-top: 25px; }
        .back-link a { color: #1a3a2a; text-decoration: none; font-weight: bold; }
        .back-link a:hover { color: #7ddfb0; }
        .footer { background: #1a3a2a; color: white; text-align: center; padding: 18px; margin-top: 30px; font-size: 13px; }
        .footer a { color: #7ddfb0; text-decoration: none; }
        .footer .earth { color: #7ddfb0; font-weight: bold; letter-spacing: 2px; }
        @media (max-width: 600px) { .container { margin: 15px; padding: 15px; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Panno-Ka-<span>Shahar</span></h1>
        <div class="tagline">🌍 SAFE EARTH · BETTER TOMOR
