<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Panno-Ka-Shahar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f0; }
        .header { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('image.jpg') center/cover no-repeat; color: white; padding: 25px 20px; text-align: center; }
        .header h1 { font-size: 36px; letter-spacing: 4px; }
        .header h1 span { color: #7ddfb0; }
        .header .tagline { font-size: 14px; color: #7ddfb0; }
        .nav { background: #1a3a2a; padding: 12px; text-align: center; }
        .nav a { color: white; text-decoration: none; padding: 8px 18px; margin: 0 4px; border-radius: 20px; transition: 0.3s; font-size: 14px; }
        .nav a:hover { background: #7ddfb0; color: #1a3a2a; }
        .container { max-width: 900px; margin: 30px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .container h2 { text-align: center; color: #1a3a2a; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1a3a2a; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .total-row { font-weight: bold; font-size: 18px; }
        .qty-btn { background: #7ddfb0; border: none; color: #1a3a2a; font-weight: bold; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; }
        .qty-btn:hover { background: #1a3a2a; color: #7ddfb0; }
        .qty-num { display: inline-block; width: 30px; text-align: center; font-weight: bold; }
        .btn-checkout { width: 100%; padding: 15px; background: #1a3a2a; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-checkout:hover { background: #7ddfb0; color: #1a3a2a; }
        .btn-clear { width: 100%; padding: 10px; background: #fff; color: #e74c3c; border: 2px solid #e74c3c; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-clear:hover { background: #e74c3c; color: white; }
        .remove-btn { background: none; border: none; color: #e74c3c; font-size: 18px; cursor: pointer; }
        .remove-btn:hover { color: #c0392b; }
        .empty-msg { text-align: center; padding: 40px; color: #777; font-size: 18px; }
        .footer { background: #1a3a2a; color: white; text-align: center; padding: 18px; margin-top: 30px; font-size: 13px; }
        .footer a { color: #7ddfb0; text-decoration: none; }
        .footer .earth { color: #7ddfb0; font-weight: bold; letter-spacing: 2px; }
        @media (max-width: 600px) {
            .container { margin: 15px; padding: 15px; overflow-x: auto; }
            th, td { padding: 8px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Panno-Ka-<span>Shahar</span></h1>
        <div class="tagline">🌍 SAFE EARTH · BETTER TOMORROW</div>
    </div>

    <div class="nav">
        <a href="index.html">🏠 Home</a>
        <a href="catalogue.html">📖 Catalogue</a>
        <a href="cart.html">🛒 Cart</a>
    </div>

    <div class="container">
        <h2>🛒 Your Shopping Cart</h2>
        <div id="cart-content"></div>
        <button class="btn-checkout" id="checkout-btn" onclick="checkoutWhatsApp()" style="display:none;">✅ Order on WhatsApp</button>
        <button class="btn-clear" id="clear-btn" onclick="clearCart()" style="display:none;">🗑️ Clear Cart</button>
    </div>

    <div class="footer">
        <p>📧 <a href="mailto:ashishkumarverma1@gmail.com">ashishkumarverma1@gmail.com</a> | 📞 8004548921</p>
        <p class="earth">🌍 SAFE EARTH · BETTER TOMORROW</p>
        <p style="font-size:11px; color:#6a8f7a; margin-top:8px;">&copy; 2026 Panno-Ka-Shahar</p>
    </div>

    <script src="cart.js"></script>
    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let content = document.getElementById('cart-content');
            let checkoutBtn = document.getElementById('checkout-btn');
            let clearBtn = document.getElementById('clear-btn');

            if (cart.length === 0) {
                content.innerHTML = '<div class="empty-msg">🛒 Aapka cart khali hai<br><br><a href="catalogue.html" style="color:#1a3a2a;font-weight:bold;">📖 Catalogue dekhein</a></div>';
                checkoutBtn.style.display = 'none';
                clearBtn.style.display = 'none';
                return;
            }

            let total = 0;
            let html = '<table><thead><tr><th>Book</th><th>Author</th><th>Price</th><th>Qty</th><th>Subtotal</th><th>Action</th></tr></thead><tbody>';

            cart.forEach((item, i) => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                html += '<tr>';
                html += '<td>' + item.title + '</td>';
                html += '<td>' + item.author + '</td>';
                html += '<td>₹' + item.price + '</td>';
                html += '<td>';
                html += '<button class="qty-btn" onclick="changeQty(' + i + ',-1)">−</button>';
                html += '<span class="qty-num">' + item.qty + '</span>';
                html += '<button class="qty-btn" onclick="changeQty(' + i + ',1)">+</button>';
                html += '</td>';
                html += '<td>₹' + subtotal + '</td>';
                html += '<td><button class="remove-btn" onclick="removeItem(' + i + ')">❌</button></td>';
                html += '</tr>';
            });

            html += '<tr class="total-row"><td colspan="4">Total</td><td colspan="2">₹' + total + '</td></tr>';
            html += '</tbody></table>';

            content.innerHTML = html;
            checkoutBtn.style.display = 'block';
            clearBtn.style.display = 'block';
        }

        function changeQty(index, delta) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart[index].qty += delta;
            if (cart[index].qty < 1) cart[index].qty = 1;
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        function clearCart() {
            if (confirm('Kya aap poora cart khali karna chahte hain?')) {
                localStorage.removeItem('cart');
                updateCartCount();
                renderCart();
            }
        }

        function checkoutWhatsApp() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) { alert('Cart khali hai!'); return; }

            let message = '🛒 *NAYA ORDER - Panno-Ka-Shahar*\n\n';
            let total = 0;
            cart.forEach((item, i) => {
                let sub = item.price * item.qty;
                total += sub;
                message += (i+1) + '. *' + item.title + '*\n';
                message += '   Author: ' + item.author + '\n';
                message += '   Price: ₹' + item.price + ' × ' + item.qty + ' = ₹' + sub + '\n\n';
            });
            message += '━━━━━━━━━━━━━━━━\n';
            message += '*TOTAL: ₹' + total + '*\n';
            message += '━━━━━━━━━━━━━━━━\n\n';
            message += '👤 *Meri Details:*\n';
            message += 'Naam: \n';
            message += 'Phone: \n';
            message += 'Pura Address: \n';
            message += 'Pincode: \n';

            let phone = '918004548921';
            let url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
            window.open(url, '_blank');
        }

        window.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
